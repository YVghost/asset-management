server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    location = /health { access_log off; return 200 'ok'; }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
    }
    # /assets is also a React route; do not redirect it to Vite's physical assets directory.
    location = /assets { try_files /index.html =404; }
    location = /assets/ { try_files /index.html =404; }
    location ~ ^/assets/.*\.(js|css|png|jpe?g|webp|gif|svg|woff2?|ttf|ico|map)$ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}

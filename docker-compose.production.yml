# Uso: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d --build
services:
  frontend:
    ports: !override ["127.0.0.1:3000:80"]
  db:
    ports: !reset []
  backend:
    ports: !reset []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DEMO_ENABLED: "false"
      COOKIE_SECURE: "true"
      API_DOCS_ENABLED: "false"

services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ams
      POSTGRES_USER: ${DB_USER:-ams}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d ams"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/ams
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_USER: ${DB_USER:-ams}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_EMAIL: ${DEMO_EMAIL:-admin@demo.local}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      LIFECYCLE_ALERT_MONTHS: ${LIFECYCLE_ALERT_MONTHS:-6}
      BOOTSTRAP_ENABLED: ${BOOTSTRAP_ENABLED:-false}
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      BOOTSTRAP_ORGANIZATION: ${BOOTSTRAP_ORGANIZATION:-}
      MASTER_ENABLED: ${MASTER_ENABLED:-false}
      MASTER_EMAIL: ${MASTER_EMAIL:-master@ams.local}
      MASTER_PASSWORD: ${MASTER_PASSWORD:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      TZ: UTC
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:

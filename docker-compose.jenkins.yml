name: ams-jenkins
services:
  jenkins:
    build:
      context: .
      dockerfile: ci/jenkins/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    environment:
      JAVA_OPTS: -Djava.awt.headless=true
      AMS_TEST_DATABASE_URL: jdbc:postgresql://jenkins-test-db:5432/ams_ci
      AMS_TEST_DATABASE_USER: ams_ci
      AMS_TEST_DATABASE_PASSWORD: ci-only-not-a-production-secret
      TZ: America/Guayaquil
    networks: [default, ci_database]
    depends_on:
      jenkins-test-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/login"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 20
    restart: unless-stopped
  jenkins-test-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ams_ci
      POSTGRES_USER: ams_ci
      POSTGRES_PASSWORD: ci-only-not-a-production-secret
    # Datos de prueba desechables; no se usa el volumen/base de la aplicación.
    tmpfs:
      - /var/lib/postgresql/data
    networks: [ci_database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ams_ci -d ams_ci"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  jenkins_home:
networks:
  ci_database:
    internal: true

spring.application.name=asset-management
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ams}
spring.datasource.username=${DB_USER:ams}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
ams.demo.enabled=${DEMO_ENABLED:false}
ams.demo.email=${DEMO_EMAIL:admin@demo.local}
ams.demo.password=${DEMO_PASSWORD:}
ams.lifecycle.alert-months=${LIFECYCLE_ALERT_MONTHS:6}
server.error.include-message=never
spring.devtools.add-properties=false
ams.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=OFF
spring.mvc.log-request-details=false
